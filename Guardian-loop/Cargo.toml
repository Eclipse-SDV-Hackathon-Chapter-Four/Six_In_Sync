[package]
name = "guardian-sil"
version = "0.1.0"
edition = "2021"

[dependencies]
async-trait = "0.1"

common = { path = "../../tooling/fault-lib/src/common" }
fault_lib = { path = "../../tooling/fault-lib/src/fault_lib" }

reqwest = {
    version = "0.12",
    default-features = false,
    features = ["json", "rustls-tls"]
}
serde = { version = "1", features = ["derive"] }
serde_json = "1"

tokio = { version = "1", features = [
    "macros",
    "rt-multi-thread",
    "signal",
    "time"
] }

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }

up-rust = "0.9"
up-transport-zenoh = "0.9"
zenoh = "1"

[[bin]]
name = "child-sensor-sim"
path = "child-sensor-sim/main.rs"

[[bin]]
name = "temp-sensor-sim"
path = "temp-sensor-sim/main.rs"

[[bin]]
name = "guardian"
path = "guardian/main.rs"

[[bin]]
name = "actuator-sim"
path = "actuator-sim/main.rs"

[[bin]]
name = bridge
path = bridge/someip_uprot_bridge.rs
